<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Context DFD - Barangay Rosario Feedback and Survey System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .diagram-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            color: #000;
        }

        .dfd-container {
            position: relative;
            width: 1000px;
            height: 550px;
        }

        /* External Entity - rectangle with shadow/offset border (Gane and Sarson) */
        .entity {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: 2px solid #000;
            z-index: 2;
        }

        .entity::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 100%;
            height: 100%;
            border: 2px solid #000;
            z-index: -1;
            background: #fff;
        }

        /* Process - rounded rectangle (Gane and Sarson) */
        .process {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: 2px solid #000;
            border-radius: 15px;
            z-index: 2;
        }

        .process .process-number {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .process .process-name {
            font-size: 13px;
            font-weight: bold;
            line-height: 1.3;
        }

        /* SVG for arrows */
        .arrows-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .arrow-line {
            stroke: #000;
            stroke-width: 1.5;
            fill: none;
        }

        .arrow-label {
            font-family: 'Arial', sans-serif;
            font-size: 10.5px;
            fill: #000;
        }

        .figure-label {
            margin-top: 20px;
            font-size: 13px;
            color: #000;
            text-align: center;
        }

        .figure-label span {
            font-weight: bold;
            background: #333;
            color: #fff;
            padding: 2px 8px;
            margin-right: 6px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="diagram-title">Proposed Context DFD (Level 0)<br>Barangay Rosario Feedback and Survey System</div>

    <div class="dfd-container">
        <!-- External Entity: Resident (user) -->
        <div class="entity" style="left: 20px; top: 195px; width: 130px; height: 70px;">
            Resident<br>(User)
        </div>

        <!-- Central Process 0 -->
        <div class="process" style="left: 365px; top: 180px; width: 240px; height: 110px;">
            <div class="process-number">0</div>
            <div class="process-name">Resident Feedback<br>and Survey<br>System</div>
        </div>

        <!-- External Entity: Admin -->
        <div class="entity" style="left: 820px; top: 195px; width: 130px; height: 70px;">
            Admin
        </div>

        <!-- SVG Arrows -->
        <svg class="arrows-svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                </marker>
            </defs>

            <!-- ============================================ -->
            <!-- ===== RESIDENT (USER) to PROCESS ===== -->
            <!-- ============================================ -->

            <!-- Feedback (Rating, Comment, Category, Attachment) -->
            <line x1="154" y1="215" x2="363" y2="215" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="155" y="207" class="arrow-label">Feedback (Rating, Comment, Category, Attachment)</text>

            <!-- Survey Responses -->
            <line x1="154" y1="245" x2="363" y2="245" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="210" y="237" class="arrow-label">Survey Responses</text>

            <!-- Profile Updates / Settings -->
            <line x1="154" y1="270" x2="363" y2="270" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="195" y="262" class="arrow-label">Profile Updates / Settings</text>

            <!-- Login Credentials -->
            <line x1="154" y1="295" x2="363" y2="295" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="215" y="316" class="arrow-label">Login Credentials</text>

            <!-- ============================================ -->
            <!-- ===== PROCESS to RESIDENT (USER) ===== -->
            <!-- ============================================ -->

            <!-- Survey Questionnaires -->
            <line x1="365" y1="145" x2="154" y2="145" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="190" y="137" class="arrow-label">Survey Questionnaires</text>

            <!-- Feedback Status -->
            <line x1="365" y1="170" x2="154" y2="170" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="218" y="162" class="arrow-label">Feedback Status</text>

            <!-- Dashboard Data -->
            <line x1="365" y1="345" x2="154" y2="345" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="218" y="365" class="arrow-label">Dashboard Data</text>

            <!-- ============================================ -->
            <!-- ===== PROCESS to ADMIN ===== -->
            <!-- ============================================ -->

            <!-- Survey Results & Responses -->
            <line x1="607" y1="145" x2="818" y2="145" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="630" y="137" class="arrow-label">Survey Results & Responses</text>

            <!-- Feedback Reports & Analytics -->
            <line x1="607" y1="170" x2="818" y2="170" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="630" y="162" class="arrow-label">Feedback Reports & Analytics</text>

            <!-- Backup Data -->
            <line x1="607" y1="215" x2="818" y2="215" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="685" y="207" class="arrow-label">Backup Data</text>

            <!-- Audit Logs & Dashboard -->
            <line x1="607" y1="345" x2="818" y2="345" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="640" y="365" class="arrow-label">Audit Logs & Dashboard</text>

            <!-- ============================================ -->
            <!-- ===== ADMIN to PROCESS ===== -->
            <!-- ============================================ -->

            <!-- Feedback Assignment to Personnel -->
            <line x1="818" y1="235" x2="607" y2="235" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="620" y="227" class="arrow-label">Feedback Assignment to Personnel</text>

            <!-- Generate Surveys -->
            <line x1="818" y1="258" x2="607" y2="258" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="670" y="253" class="arrow-label">Generate Surveys</text>

            <!-- User / Personnel Management -->
            <line x1="818" y1="280" x2="607" y2="280" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="630" y="275" class="arrow-label">User / Personnel Management</text>

            <!-- Login Credentials (Admin) -->
            <line x1="818" y1="300" x2="607" y2="300" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="670" y="320" class="arrow-label">Login Credentials</text>

        </svg>
    </div>

    <div class="figure-label">
        <span>FIGURE 2</span> Proposed Context DFD (Level 0) for the Barangay Rosario Feedback and Survey System.
    </div>
</body>

</html>
