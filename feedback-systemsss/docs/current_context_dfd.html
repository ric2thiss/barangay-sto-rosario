<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Context DFD - Barangay Rosario Feedback and Survey System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .diagram-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            color: #000;
        }

        .dfd-container {
            position: relative;
            width: 900px;
            height: 520px;
        }

        /* External Entity - rectangle with shadow/offset border */
        .entity {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: 2px solid #000;
            z-index: 2;
        }

        .entity::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 100%;
            height: 100%;
            border: 2px solid #000;
            z-index: -1;
            background: #fff;
        }

        /* Process - rounded rectangle */
        .process {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: 2px solid #000;
            border-radius: 15px;
            z-index: 2;
        }

        .process .process-number {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .process .process-name {
            font-size: 13px;
            font-weight: bold;
            line-height: 1.3;
        }

        /* SVG for arrows */
        .arrows-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .arrow-line {
            stroke: #000;
            stroke-width: 1.5;
            fill: none;
        }

        .arrow-label {
            font-family: 'Arial', sans-serif;
            font-size: 11px;
            fill: #000;
        }

        .figure-label {
            margin-top: 20px;
            font-size: 13px;
            color: #000;
            text-align: center;
        }

        .figure-label span {
            font-weight: bold;
            background: #333;
            color: #fff;
            padding: 2px 8px;
            margin-right: 6px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="diagram-title">Current Context DFD<br>Barangay Rosario Feedback and Survey System</div>

    <div class="dfd-container">
        <!-- External Entity: Resident -->
        <div class="entity" style="left: 20px; top: 190px; width: 130px; height: 70px;">
            Resident
        </div>

        <!-- Central Process -->
        <div class="process" style="left: 325px; top: 175px; width: 220px; height: 100px;">
            <div class="process-number">0</div>
            <div class="process-name">Manual Feedback<br>and Survey<br>Process</div>
        </div>

        <!-- External Entity: Barangay Staff -->
        <div class="entity" style="left: 720px; top: 190px; width: 130px; height: 70px;">
            Barangay<br>Staff
        </div>

        <!-- SVG Arrows -->
        <svg class="arrows-svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                </marker>
            </defs>

            <!-- === RESIDENT to PROCESS === -->

            <!-- Written Complaint / Feedback (Resident -> Process) -->
            <line x1="154" y1="210" x2="323" y2="210" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="165" y="200" class="arrow-label">Written Complaint / Feedback</text>

            <!-- Paper Survey Responses (Resident -> Process) -->
            <line x1="154" y1="247" x2="323" y2="247" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="172" y="237" class="arrow-label">Paper Survey Responses</text>

            <!-- === PROCESS to RESIDENT === -->

            <!-- Verbal / Written Acknowledgment (Process -> Resident) -->
            <line x1="325" y1="175" x2="154" y2="175" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="155" y="165" class="arrow-label">Verbal / Written Acknowledgment</text>

            <!-- Feedback Status Update (Process -> Resident) -->
            <line x1="325" y1="280" x2="154" y2="280" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="167" y="300" class="arrow-label">Feedback Status Update</text>

            <!-- === PROCESS to BARANGAY STAFF === -->

            <!-- Compiled Feedback Records (Process -> Staff) -->
            <line x1="547" y1="210" x2="718" y2="210" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="565" y="200" class="arrow-label">Compiled Feedback Records</text>

            <!-- Survey Tally / Summary (Process -> Staff) -->
            <line x1="547" y1="247" x2="718" y2="247" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="580" y="237" class="arrow-label">Survey Tally / Summary</text>

            <!-- === BARANGAY STAFF to PROCESS === -->

            <!-- Paper Survey Forms (Staff -> Process) -->
            <line x1="718" y1="175" x2="547" y2="175" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="587" y="165" class="arrow-label">Paper Survey Forms</text>

            <!-- Feedback Assignment (Staff -> Process) -->
            <line x1="718" y1="280" x2="547" y2="280" class="arrow-line" marker-end="url(#arrowhead)" />
            <text x="582" y="300" class="arrow-label">Feedback Assignment</text>

        </svg>
    </div>

    <div class="figure-label">
        <span>FIGURE 1</span> Current Context DFD for the Barangay Rosario Feedback and Survey System.
    </div>
</body>

</html>
